            width: 50px;
            height: 50px;

        .toast {

            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);

            transition: transform 0.3s;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 10px;

        .toast.show { transform: translateX(0); }
        .toast i { color: var(--primary); font-size: 20px; }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); }

            .products-grid.list-view .product-image { padding-top: 100%; height: auto; }
            .logo-text h1 { font-size: 18px; }
        }

        @media (max-width: 480px) {
            .category-title { flex-direction: column; text-align: center; }
        }

        const GADGET_KW = ['ঘড়ি', 'ঘড়ি', 'watch', 'থার্মোমিটার', 'thermometer', 'হিটিং', 'প্যাড', 'earbuds', 'earphone', 'headphone', 'headset', 'চার্জার', 'charger', 'cable', 'speaker', 'স্পিকার', 'মোবাইল', 'mobile', 'phone', 'হেয়ার ড্রায়ার', 'dryer', 'trimmer', 'ট্রিমার', 'shaver', 'শেভার', 'power bank', 'powerbank', 'পাওয়ার ব্যাংক', 'smartwatch', 'স্মার্ট ওয়াচ', 'gadget', 'গ্যাজেট', 'usb', 'হোল্ডার', 'neckband', 'নেকব্যান্ড'];
        const KIDS_KW = ['kids', 'কিডস', 'children', 'child', 'baby', 'বেবি', 'preschool', 'প্রিস্কুল', 'backpack', 'ব্যাকপ্যাক', 'school', 'স্কুল', 'student', 'ছোটদের', 'বাচ্চাদের', 'toys', 'খেলনা', 'টয়'];

        function classifyProduct(p) {
            const text = ((p.name || '') + ' ' + (p.category || '')).toLowerCase();
            if (COUPLE_KW.some(k => text.includes(k))) return 'কাপল';
            if (KIDS_KW.some(k => text.includes(k))) return 'বাচ্চাদের ফ্যাশন';
            if (BEAUTY_KW.some(k => text.includes(k))) return 'বিউটি ও স্কিন কেয়ার';
            if (HOME_APP_KW.some(k => text.includes(k))) return 'হোম ও কিচেন';
            if (FEMALE_KW.some(k => text.includes(k))) return 'মহিলা ফ্যাশন';
            if (MALE_KW.some(k => text.includes(k))) return 'পুরুষ ফ্যাশন';
            if (GADGET_KW.some(k => text.includes(k))) return 'গ্যাজেট';
            return 'অন্যান্য';
        }

        // Get category from URL
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat') || 'all';
        const searchQuery = (urlParams.get('q') || '').trim();
        let activeSub = urlParams.get('sub') || 'সব';

        let loadedProducts = [];       // এ পর্যন্ত লোড হওয়া সব পণ্য
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        // ===== ক্যাশ — ক্যাটাগরি পেজ দ্রুত খুলতে (৫ মিনিট) =====
        const CAT_CACHE_PREFIX = 'sk_cat_cache';
        const CAT_CACHE_TTL = 15 * 60 * 1000;   // ১৫ মিনিট — Firestore read বাঁচায়
        let cachedCategoryData = null;
        function catCacheKey() {
            // গ্রুপ ক্যাটাগরি (বাচ্চাদের ফ্যাশন ইত্যাদি) + 'all' → একই শেয়ার্ড ক্যাশ (সব পণ্য)
            if (searchQuery) return CAT_CACHE_PREFIX + '_q_' + searchQuery;
            const key = (GROUP_CATS[category] || category === 'all') ? 'all' : category;
            return CAT_CACHE_PREFIX + '_' + key;
        }
        function readCatCache() {
            try {
                const c = JSON.parse(localStorage.getItem(catCacheKey()) || 'null');
                if (c && c.v === 3 && c.t && (Date.now() - c.t < CAT_CACHE_TTL) && c.list && c.list.length) return c.list;
            } catch (e) {}
            return null;
        }
        function writeCatCache(list) {
            try { localStorage.setItem(catCacheKey(), JSON.stringify({ v: 3, t: Date.now(), list: list })); } catch (e) {}
        }

        // ===== Pagination state =====
        const PAGE_SIZE = 10;
        let lastDoc = null;
        let hasMore = false;
        let pageLoading = false;
        let currentPage = 1;
        let allLoadedProducts = [];   // গ্রুপ ক্যাটাগরির জন্য সব লোড হওয়া পণ্য (client-side পেজিং)

        // ===== Filter state =====
        let inStockOnly = false;

        // ===== INIT =====
        function init() {
            updateCategoryHeader();
            renderSubChips();
            highlightActiveCategory();
            loadQuickCategories();
            setupFilters();
            // loadNextPage নিজেই ক্যাশ দেখায় + ব্যাকগ্রাউন্ডে লাইভ refresh করে
            resetAndReload();
            updateCartCount();
            if (searchQuery) {
                try { skTrack('Search', { search_term: searchQuery }); } catch (e) {}
                document.getElementById('searchInput').value = searchQuery;
                document.getElementById('categoryName').textContent = '🔍 ' + searchQuery;
                document.getElementById('breadcrumbCat').textContent = 'সার্চ: ' + searchQuery;
            }
        }

        // ===== UPDATE HEADER =====
               function updateCategoryHeader() {
            const name = category === 'all' ? 'সকল পণ্য' : category;
            document.getElementById('categoryName').textContent = name;
            document.getElementById('breadcrumbCat').textContent = name;
            document.getElementById('categoryIconBig').textContent = GROUP_CATS[category] || CATEGORY_ICONS[category] || '📦';
            document.title = name + ' - স্মার্ট কেনাকাটা';
            try {
                const catName = name;
                document.title = catName + ' - মাত্র ৳ থেকে শুরু | স্মার্ট কেনাকাটা';
                document.getElementById('metaDesc').content = catName + ' ক্যাটাগরির সেরা পণ্য কিনুন স্মার্ট কেনাকাটা থেকে।';
                document.getElementById('canonicalCat').href = window.location.href;
                document.getElementById('ogCatUrl').content = window.location.href;
                document.getElementById('ogCatTitle').content = catName + ' - স্মার্ট কেনাকাটা';
                document.getElementById('pageTitle').textContent = catName + ' - স্মার্ট কেনাকাটা | Best Price BD';
                const schemaEl = document.getElementById('cat-schema');
                if (schemaEl) {
                    const schema = {
                        "@context": "https://schema.org",
                        "@type": "CollectionPage",
                        "name": catName + " - স্মার্ট কেনাকাটা",
                        "description": catName + " ক্যাটাগরির সব পণ্য",
                        "url": window.location.href,
                        "breadcrumb": {
                            "@type": "BreadcrumbList",
                            "itemListElement": [
                                {"@type": "ListItem", "position": 1, "name": "হোম", "item": "https://mehedi114.github.io/smart-kenakata/"},
                                {"@type": "ListItem", "position": 2, "name": catName, "item": window.location.href}
                            ]
                        }
                    };
                    schemaEl.textContent = JSON.stringify(schema);
                }
                // ===== 🔍 AUTO SEO (seo.js) — richer title/meta/keywords/CollectionPage =====
                if (window.SKSEO) SKSEO.applyCategorySEO(category === 'all' ? 'all' : category);
            } catch(e) {}
        }

        // ===== HIGHLIGHT ACTIVE CATEGORY =====
        function highlightActiveCategory() {
            try {
                document.querySelectorAll('.quick-cat').forEach(link => {
                    try {
                        const url = new URL(link.href, window.location.origin);
                        const linkCat = url.searchParams.get('cat');
                        if (linkCat === category) {
                            link.classList.add('active');
                        }
                    } catch(e) {
                        // fallback parse
                        try {
                            const href = link.getAttribute('href') || '';
                            if (href.includes('cat=' + category) || (category==='all' && href.includes('cat=all'))) {
                                link.classList.add('active');
                            }
                        } catch(e2) {}
                    }
                });
            } catch(e) { console.log('highlight error', e); }
        }

        // ===== SUB-CATEGORY CHIPS =====
        function escAttr(text) { return skEscape(String(text || '')); }

        function renderSubChips() {
            const strip = document.getElementById('subCatStrip');
            if (!strip) return;
            const subs = SUB_CATS[category];
            if (!subs) { strip.style.display = 'none'; strip.innerHTML = ''; return; }
            const groupList = loadedProducts.filter(p => classifyProduct(p) === category);
            let html = '';
            subs.forEach(s => {
                let count = null;
                if (!s.kw) count = groupList.length;
                else {
                    count = groupList.filter(p => productSubCat(p, category) === s.n).length;
                }
                // খালি sub লুকাই — কিন্তু 'সব' আর 'কাপল' সবসময় থাকবে
                if (s.n !== 'সব' && s.kw !== '__COUPLE__' && count === 0) return;
                html += '<button class="subcat-chip' + (activeSub === s.n ? ' active' : '') + '" data-sub="' + escAttr(s.n) + '">'
                    + skEscape(s.n)
                    + (count !== null ? ' <span class="sub-count">' + count + '</span>' : '')
                    + '</button>';
            });
            strip.innerHTML = html;
            strip.style.display = 'flex';
        }

        function setSub(sub) {
            activeSub = sub || 'সব';
            // URL-ও আপডেট (share করার সময় sub ঠিক থাকে)
            try {
                const u = new URL(window.location.href);
                if (activeSub === 'সব') u.searchParams.delete('sub');
                else u.searchParams.set('sub', activeSub);
                history.replaceState(null, '', u.toString());
            } catch (e) {}
            renderSubChips();
            // ডেটা লোড হওয়ার আগেই chip-এ ক্লিক করলে — খালি দেখানোর বদলে reload
            if (!loadedProducts.length && !pageLoading) {
                fallbackDone = false;
                resetAndReload();
                return;
            }
            applyClientFilters();
        }

        // chip ক্লিক ডেলিগেশন
        (function () {
            const bind = () => {
                const strip = document.getElementById('subCatStrip');
                if (!strip || strip.dataset.bound) return;
                strip.dataset.bound = '1';
                strip.addEventListener('click', function (e) {
                    const b = e.target.closest ? e.target.closest('.subcat-chip') : null;
                    if (b) setSub(b.getAttribute('data-sub'));
                });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
            else bind();
        })();

        // ===== লাইভ Quick Categories — ডিফল্ট ৪টা + Firestore merge (কখনো ক্যাটাগরি হারায় না) =====
        const QUICK_DEFAULTS = [
            { name: 'মহিলা ফ্যাশন', icon: '👗' },
            { name: 'পুরুষ ফ্যাশন', icon: '👔' },
            { name: 'কাপল', icon: '💑' },
            { name: 'বিউটি ও স্কিন কেয়ার', icon: '💄' },
            { name: 'গ্যাজেট', icon: '📱' },
            { name: 'হোম ও কিচেন', icon: '🍳' },
            { name: 'বাচ্চাদের ফ্যাশন', icon: '🧒' },
            { name: 'অন্যান্য', icon: '📦' }
        ];
        function mergeCats(base, live) {
            const seen = {}, out = [];
            base.forEach(c => { if (!seen[c.name]) { seen[c.name] = 1; out.push(c); } });
            (live || []).forEach(c => { if (!seen[c.name]) { seen[c.name] = 1; out.push(c); } });
            return out;
        }
        function loadQuickCategories() {
            // ক্যাশ আগে (instant) — ডিফল্ট নিশ্চিত
            let current = QUICK_DEFAULTS.slice();
            const cachedCats = readCatsCache();
            if (cachedCats && cachedCats.length) current = mergeCats(QUICK_DEFAULTS, cachedCats);
            renderQuickCats(current);
            // Firestore লাইভ — normalize + clean + merge
            db.collection('categories').get().then(snap => {
                const live = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    if (d.active !== false && d.name) {
                        const nm = normalizeCatName(d.name);
                        live.push({ name: nm, icon: d.icon || '' });
                    }
                });
                live = cleanCats(live);
                if (!live.length) return;
                live.sort((a, b) => a.name.localeCompare(b.name));
                const merged = mergeCats(QUICK_DEFAULTS, live);
                renderQuickCats(merged);
                try { localStorage.setItem('sk_categories', JSON.stringify({ v: 2, t: Date.now(), list: merged })); } catch (e) {}
            }).catch(() => {});
        }
        function renderQuickCats(cats) {
            const wrap = document.getElementById('quickCategories');
            let html = '<a href="category.html?cat=all" class="quick-cat"><i class="fas fa-th"></i> সব পণ্য</a>';
            cats.forEach(c => {
                html += '<a href="category.html?cat=' + encodeURIComponent(c.name) + '" class="quick-cat">' + (c.icon ? c.icon + ' ' : '') + skEscape(c.name) + '</a>';
            });
            wrap.innerHTML = html;
            highlightActiveCategory();
        }


        // ===== FILTER SETUP =====
        function setupFilters() {
            inStockOnly = false;
        }

        function resetAndReload() {
            currentPage = 1;
            inStockOnly = document.getElementById('inStockOnly') ? document.getElementById('inStockOnly').checked : false;
            loadedProducts = [];
            lastDoc = null;
            hasMore = false;
            document.getElementById('productsGrid').innerHTML =
                '<div class="sk-skeleton-card"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>'.repeat(4);
            loadNextPage();
        }

        // ===== QUERY (index-free) =====
        // কোনো composite index লাগে না — সব sort/filter client-side হয়
        function buildQuery() {
            let q = db.collection('products');
            if (searchQuery) {
                // সার্চ: keywords array-contains (single-field — index লাগে না)
                const token = searchQuery.toLowerCase().split(/\s+/).sort((a, b) => b.length - a.length)[0];
                q = q.where('keywords', 'array-contains', token);
            } else if (category !== 'all' && !GROUP_CATS[category]) {
                q = q.where('category', '==', category);
            }
            return q;
        }

        // সমান্তরাল (parallel) ব্যাচ fetch — ২০০ করে ৩টা একসাথে, সর্বোচ্চ ৬০০।
        // আগে ছিল: ১২০ করে ৪টা সিকোয়েনশিয়াল (ধীর)। এখন ১টা নেটওয়ার্ক ঢেউতেই সব।
        // একটাই হালকা query — ৪০০ পর্যন্ত (আপনার ~৬০টা প্রোডাক্ট: ১ ঢেউতেই সব)
        function fetchAllProducts() {
            return db.collection('products').limit(400).get().then(snap => {
                const list = [];
                snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                return list;
            });
        }

        function loadNextPage() {
            if (pageLoading) return;
            pageLoading = true;
            const cacheList = readCatCache();

            // ১) ক্যাশ থাকলে সাথে সাথে render — রিপিট ভিজিট instant (ঝাপাঝাপি নেই)
            if (cacheList && cacheList.length) {
                loadedProducts = cacheList;
                lastDoc = null; hasMore = false;
                fallbackDone = true;
                applyClientFilters();
            }

            // ২) ধীর সংযোগ গার্ড — ১২ সেকেন্ডে না এলে ক্যাশ/error UI (skeleton চিরকাল ঘোরে না)
            clearTimeout(fallbackTimer);
            fallbackTimer = setTimeout(() => {
                const grid = document.getElementById('productsGrid');
                if (grid && grid.querySelector('.sk-skeleton-card')) {
                    pageLoading = false;
                    showCacheOrError('ধীর সংযোগ');
                }
            }, 12000);

            // ৩) লাইভ fetch — এক query
            // সার্চে keywords-এ কিছু না পেলে → সব টেনে client-side ফিল্টার (পুরনো প্রোডাক্টে keywords নেই)
            buildQuery().limit(400).get()
                .then(snap => {
                    if (searchQuery && snap.empty) return fetchAllProducts();
                    const list = [];
                    snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    return list;
                })
                .then(list => {
                    clearTimeout(fallbackTimer);
                    pageLoading = false;
                    loadedProducts = list;
                    lastDoc = null; hasMore = false;
                    fallbackDone = true;
                    if (!searchQuery) writeCatCache(list);
                    applyClientFilters();
                })
                .catch(err => {
                    clearTimeout(fallbackTimer);
                    pageLoading = false;
                    console.error('category load error:', err);
                    if (!(cacheList && cacheList.length)) {
                        showCacheOrError((err && (err.code || err.message)) || 'লোড করতে সমস্যা');
                    }
                });
        }

        // অফলাইন → অনলাইন হলে ক্যাটাগরি পেজ অটো-রিলোড
        window.addEventListener('online', function () { location.reload(); });

        // Firestore থেকে কিছু না এলে — আগের ভিজিটের ক্যাশ থেকে পণ্য দেখাই
        // (ক্যাশও না থাকলে তবেই error UI)
        function showCacheOrError(msg) {
            const grid = document.getElementById('productsGrid');
            const cached = readCatCache();
            if (cached && cached.length) {
                loadedProducts = cached;
                lastDoc = null; hasMore = false;
                fallbackDone = true;
                applyClientFilters();
                const note = document.createElement('div');
                note.style.cssText = 'text-align:center;color:#b45309;background:#fffbeb;padding:8px 14px;border-radius:10px;font-size:12px;margin:10px 0;';
                note.textContent = '📶 নেটওয়ার্ক সমস্যা — সংরক্ষিত পণ্য দেখানো হচ্ছে। ইন্টারনেট ফিরলে অটো-রিলোড হবে।';
                grid.parentNode.insertBefore(note, grid);
                return true;
            }
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h2>পণ্য লোড করতে সমস্যা</h2><p>' + skEscape(msg || 'নেটওয়ার্ক/ডেটাবেস সমস্যা') + '</p>' +
                '<button onclick="fallbackDone=false;resetAndReload()" style="margin-top:10px;padding:8px 16px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;">আবার চেষ্টা করুন</button></div>';
            return false;
        }

        let fallbackDone = false;
        let fallbackTimer = null;
        // পুরনো fallbackLoad-এর কাজ এখন loadNextPage-তেই — নামটা রাখলাম (পুরনো কল ভাঙবে না)
        function fallbackLoad() {
            loadNextPage();
        }

        // ===== CLIENT FILTERS (দাম/স্টক/সার্চ-রিফাইন) =====
        function applyClientFilters() {
            let list = loadedProducts.slice();
            // client-side pagination-এর জন্য filtered সব পণ্য রাখি
            allLoadedProducts = [];
            if (searchQuery) {
                const terms = searchQuery.toLowerCase().split(/\s+/).filter(Boolean);
                list = list.filter(p => {
                    const text = ((p.name || '') + ' ' + (p.category || '') + ' ' + (p.description || '')).toLowerCase();
                    return terms.every(t => text.includes(t));
                });
            }
            if (inStockOnly) list = list.filter(p => (p.stock === undefined || p.stock === null) || p.stock > 0);
            // নতুন গ্রুপ ক্যাটাগরি — নাম দেখে অটো সাজানো
            if (GROUP_CATS[category]) {
                list = list.filter(p => classifyProduct(p) === category);
                // Sub-category ফিল্টার
                if (activeSub && activeSub !== 'সব') {
                    const subDef = (SUB_CATS[category] || []).find(s => s.n === activeSub);
                    if (subDef) {
                        list = list.filter(p => productSubCat(p, category) === activeSub);
                    }
                }
            }

            const sortBy = document.getElementById('sortSelect').value;
            // সবসময় client-side sort (index-free লোডার — সার্ভার sort নেই)
            if (sortBy === 'nameAZ') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            else if (sortBy === 'priceLow') list.sort((a, b) => (a.price || 0) - (b.price || 0));
            else if (sortBy === 'priceHigh') list.sort((a, b) => (b.price || 0) - (a.price || 0));
            else list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            allLoadedProducts = list;
            renderGrid(list);
        }

        // ===== DISPLAY =====
        function escapeHtml(text) { return skEscape(text); }

        function productCardHtml(product) {
            const discount = product.oldPrice ? Math.round(((product.oldPrice - product.price) / product.oldPrice) * 100) : 0;
            const safeName = (product.name || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const safeImage = (product.image || '').replace(/'/g, "\\'");
            const stockOut = (product.stock !== undefined && product.stock !== null && product.stock <= 0);

            let html = '<div class="product-card" onclick="viewProduct(\'' + product.id + '\')">';
            html += '<div class="product-image">';
            if (discount > 0) html += '<span class="discount-badge">-' + discount + '%</span>';
            if (skHasFlash(product)) html += '<span class="badge-flash">⚡ ফ্ল্যাশ সেল</span>';
            else if (product.featured) html += '<span class="badge-popular">⭐ জনপ্রিয়</span>';
            else html += skStockBadge(product);
            html += '<button class="sk-qv-btn" onclick="event.stopPropagation(); openQuickView(\'' + product.id + '\')" title="কুইক ভিউ"><i class="fas fa-eye"></i></button>';
            html += '<img src="' + skImg(product.image, 600) + '" alt="' + safeName + '" loading="lazy" onerror="this.src=\'https://via.placeholder.com/300\'">';
            html += '</div>';
            html += '<div class="product-info">';
            html += '<div class="product-category">' + escapeHtml(product.category || 'সাধারণ') + '</div>';
            html += '<h3 class="product-title">' + escapeHtml(product.name) + '</h3>';
            html += '<div class="product-price">';
            html += '<span class="current-price">৳' + product.price + '</span>';
            if (product.oldPrice) html += '<span class="old-price">৳' + product.oldPrice + '</span>';
            html += '</div>';
            if (stockOut) {
                html += '<button class="add-cart-btn" disabled><i class="fas fa-ban"></i> স্টক শেষ</button>';
            } else if (skHasVariants(product)) {
                html += '<button class="add-cart-btn variant-btn" onclick="event.stopPropagation(); viewProduct(\'' + product.id + '\')"><i class="fas fa-list-ul"></i> অপশন দেখুন</button>';
            } else {
                html += '<button class="add-cart-btn" onclick="event.stopPropagation(); addToCart(\'' + product.id + '\', \'' + safeName + '\', ' + product.price + ', \'' + safeImage + '\')">';
                html += '<i class="fas fa-cart-plus"></i> কার্টে যোগ করুন</button>';
            }
            html += '</div></div>';
            return html;
        }

        function renderGrid(all) {
            const grid = document.getElementById('productsGrid');
            const info = document.getElementById('resultsInfo');
            // client-side pagination — সবসময় ১০টা করে
            const total = all.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            const products = all.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

            if (total === 0) {
                document.getElementById('pagination').style.display = 'none';
                document.getElementById('pageInfo').style.display = 'none';
                // cache-এ ডেটা থাকলেও filter-এ সব বাদ পড়েছে? তাহলে 'সব' দেখাই
                if (all.length === 0 && readCatCache()) {
                    loadedProducts = readCatCache();
                    allLoadedProducts = loadedProducts;
                    fallbackDone = true;
                    activeSub = 'সব';
                    applyClientFilters();
                    return;
                }
                if (category === 'কাপল' || activeSub === 'কাপল') {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-heart" style="color:#ec4899;"></i>
                            <h2>💑 কাপল কালেকশন শীঘ্রই আসছে!</h2>
                            <p>ম্যাচিং সেট, জোড়া পাঞ্জাবি-শাড়ি, কাপল টি-শার্ট — একসাথে কিনুন</p>
                            <a href="category.html?cat=all">← সব পণ্য দেখুন</a>
                        </div>
                    `;
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <h2>কোন পণ্য পাওয়া যায়নি</h2>
                            <p>ফিল্টার বদলে দেখুন বা অন্য কিছু খুঁজুন</p>
                            <a href="index.html">← হোমে ফিরে যান</a>
                        </div>
                    `;
                }
                info.style.display = 'none';
                document.getElementById('categoryCount').textContent = '০ টি পণ্য';
                renderSubChips();
                updateLoadMoreBtn();
                return;
            }

            info.style.display = 'flex';
            document.getElementById('resultsCount').textContent = total;
            document.getElementById('categoryCount').textContent = total + ' টি পণ্য পাওয়া গেছে';

            grid.innerHTML = products.map(productCardHtml).join('');
            renderSubChips();
            updateLoadMoreBtn();
            updatePagination(total, totalPages);
            // স্টার রেটিং — রিভিউ থেকে (যদি থাকে)
            try {
                skLoadRatings(products.map(p => p.id), map => {
                    document.querySelectorAll('#productsGrid .product-card[data-pid]').forEach(card => {
                        const pid = card.getAttribute('data-pid');
                        const p = products.find(x => x.id === pid);
                        if (!p) return;
                        const starsHtml = skRatingStarsHtml(p, map);
                        if (!starsHtml) return;
                        const priceEl = card.querySelector('.product-price');
                        if (priceEl) priceEl.insertAdjacentHTML('beforebegin', starsHtml);
                    });
                });
            } catch (e) {}
        }

        // ===== Pagination UI — পেজ নাম্বার + prev/next =====
        function updatePagination(total, totalPages) {
            const wrap = document.getElementById('pagination');
            const info = document.getElementById('pageInfo');
            if (total <= PAGE_SIZE) {
                wrap.style.display = 'none';
                info.style.display = 'none';
                return;
            }
            wrap.style.display = 'flex';
            info.style.display = 'block';
            info.textContent = 'পেজ ' + currentPage + ' / ' + totalPages + ' — মোট ' + total + ' টি পণ্য';

            document.getElementById('pagePrevBtn').disabled = currentPage <= 1;
            document.getElementById('pageNextBtn').disabled = currentPage >= totalPages;

            // ১ ২ ৩ ... শেষ (সবসময় ৫টার বেশি দেখাই না)
            const nums = [];
            const start = Math.max(1, Math.min(currentPage - 2, totalPages - 4));
            const end = Math.min(totalPages, start + 4);
            if (start > 1) nums.push(1);
            if (start > 2) nums.push('...');
            for (let i = start; i <= end; i++) nums.push(i);
            if (end < totalPages - 1) nums.push('...');
            if (end < totalPages) nums.push(totalPages);

            document.getElementById('pageNumbers').innerHTML = nums.map(n =>
                n === '...'
                    ? '<span class="sk-page-dots">…</span>'
                    : '<button class="sk-page-num' + (n === currentPage ? ' active' : '') + '" onclick="goPage(' + n + ')">' + n + '</button>'
            ).join('');
            // scroll to top of grid
            try {
                const g = document.getElementById('productsGrid');
                if (g && currentPage > 1) g.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (e) {}
        }

        function goPage(p) {
            const total = allLoadedProducts.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (p < 1 || p > totalPages) return;
            currentPage = p;
            applyClientFilters();
        }

        function updateLoadMoreBtn() {
            // পুরনো "আরো পণ্য দেখুন" বাটন সরানো হয়েছে — এখন pagination ব্যবহার হয়
        }

        function applySorting() {
            // fallback (সব পণ্য client-side) চললে — আবার indexed query-তে যাওয়ার দরকার নেই, দ্রুত filter
            if (fallbackDone && loadedProducts.length) {
                applyClientFilters();
                return;
            }
            fallbackDone = false;
            resetAndReload();
        }

        // ===== SEARCH (এই পেজের ভেতর) =====
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            clearTimeout(window._catSearchTimer);
            window._catSearchTimer = setTimeout(() => {
                applyClientFiltersLocal(query);
            }, 200);
        });
        function applyClientFiltersLocal(query) {
            let list = loadedProducts.slice();
            if (query) {
                list = list.filter(p =>
                    (p.name && p.name.toLowerCase().includes(query)) ||
                    (p.description && p.description.toLowerCase().includes(query)) ||
                    (p.category && p.category.toLowerCase().includes(query))
                );
            }
            if (inStockOnly) list = list.filter(p => (p.stock === undefined || p.stock === null) || p.stock > 0);
            if (GROUP_CATS[category]) {
                list = list.filter(p => classifyProduct(p) === category);
                if (activeSub && activeSub !== 'সব') {
                    const subDef = (SUB_CATS[category] || []).find(s => s.n === activeSub);
                    if (subDef) {
                        list = list.filter(p => productSubCat(p, category) === activeSub);
                    }
                }
            }
            const sortBy = document.getElementById('sortSelect').value;
            if (sortBy === 'priceLow') list.sort((a, b) => (a.price || 0) - (b.price || 0));
            else if (sortBy === 'priceHigh') list.sort((a, b) => (b.price || 0) - (a.price || 0));
            else if (sortBy === 'nameAZ') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            allLoadedProducts = list;
            renderGrid(list);
        }

        // ===== ⚡ কুইক ভিউ =====
        function openQuickView(pid) {
            const p = loadedProducts.find(x => x.id === pid) || allLoadedProducts.find(x => x.id === pid);
            if (!p) return;
            const modal = document.getElementById('qvModal');
            const body = document.getElementById('qvBody');
            const overlay = document.getElementById('qvOverlay');
            if (!modal || !body) return;
            const discount = p.oldPrice ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
            const safeName = (p.name || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const safeImage = (p.image || 'https://via.placeholder.com/300').replace(/'/g, "\\'");
            const stockOut = (p.stock !== undefined && p.stock !== null && p.stock <= 0);
            let html = '<div class="sk-qv-img"><img src="' + skImg(p.image, 600) + '" alt="' + safeName + '" onerror="this.src=\'https://via.placeholder.com/300\'">';
            if (discount > 0) html += '<span class="sk-qv-off">-' + discount + '%</span>';
            html += '</div>';
            html += '<div class="sk-qv-info">';
            html += '<div class="sk-qv-cat">' + escapeHtml(p.category || 'সাধারণ') + '</div>';
            html += '<h3>' + escapeHtml(p.name) + '</h3>';
            html += '<div class="sk-qv-price"><span class="current-price">৳' + p.price + '</span>';
            if (p.oldPrice) html += '<span class="old-price">৳' + p.oldPrice + '</span></div>';
            html += '<div class="sk-qv-actions">';
            if (stockOut) {
                html += '<button class="add-cart-btn" disabled><i class="fas fa-ban"></i> স্টক শেষ</button>';
            } else if (skHasVariants(p)) {
                html += '<button class="add-cart-btn variant-btn" onclick="closeQuickView(); viewProduct(\'' + p.id + '\')"><i class="fas fa-list-ul"></i> অপশন দেখুন</button>';
            } else {
                html += '<button class="add-cart-btn" onclick="event.stopPropagation(); addToCart(\'' + p.id + '\', \'' + safeName + '\', ' + p.price + ', \'' + safeImage + '\'); closeQuickView();">';
                html += '<i class="fas fa-cart-plus"></i> কার্টে যোগ করুন</button>';
            }
            html += '</div>';
            html += '<button class="sk-qv-detail" onclick="closeQuickView(); viewProduct(\'' + p.id + '\')">বিস্তারিত দেখুন <i class="fas fa-arrow-right"></i></button>';
            html += '</div>';
            body.innerHTML = html;
            modal.classList.add('open');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
            try {
                skLoadRatings([p.id], map => {
                    const starsHtml = skRatingStarsHtml(p, map);
                    if (starsHtml && body.querySelector('.sk-qv-cat')) {
                        body.querySelector('.sk-qv-cat').insertAdjacentHTML('afterend', starsHtml);
                    }
                });
            } catch (e) {}
        }
        function closeQuickView() {
            const modal = document.getElementById('qvModal');
            const overlay = document.getElementById('qvOverlay');
            if (modal) modal.classList.remove('open');
            if (overlay) overlay.classList.remove('show');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeQuickView(); });

        // ===== SET VIEW =====
        function setView(view, btn) {
            const grid = document.getElementById('productsGrid');
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (view === 'list') {
                grid.classList.add('list-view');
            } else {
                grid.classList.remove('list-view');
            }
        }

        // ===== VIEW PRODUCT =====
        function viewProduct(productId) {
            window.location.href = 'product-details.html?id=' + productId;
        }

        // ===== CART =====
        function addToCart(id, name, price, image) {
            const existing = cart.find(item => item.id === id && !item.size && !item.color);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id: id, name: name, price: price, image: image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showToast('✅ কার্টে যোগ করা হয়েছে!');
            skTrack('AddToCart', { value: Number(price) || 0, currency: 'BDT', content_name: name, content_ids: [id] });
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // ===== TOAST =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        init();
    </script>
