name: 📢 Daily Facebook Poster

on:
  schedule:
    - cron: '0 3 * * *'  # সকাল ৯টা BD
    - cron: '0 14 * * *' # রাত ৮টা BD - HOT HOUR
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_POSTER_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/daily-poster.js
