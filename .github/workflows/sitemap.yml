name: 🔍 Auto Generate Sitemap

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Generate Sitemap
        run: |
          node scripts/generate-sitemap.js
      
      - name: Commit and Push if Changed
        run: |
          git config user.name "SEO Bot"
          git config user.email "seo@smart-kenakata.com"
          git add sitemap.xml sitemap-products.xml
          git diff --staged --quiet || git commit -m "🔍 Auto-update sitemap.xml - $(date +'%Y-%m-%d')"
          git push
