        // ===== 🎬 ভিডিও EMBED — YouTube / Facebook / Vimeo / direct mp4 (Cloudinary) =====
        function buildVideoEmbed(url) {
            if (!url || typeof url !== 'string') return '';
            url = url.trim();
            if (!/^https?:\/\//i.test(url)) return ''; // security: শুধু http/https লিংক
            const safe = url.replace(/"/g, '%22');
            // ▶️ YouTube (watch?v=, youtu.be, shorts, embed)
            let m = url.match(/(?:youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,20})/i);
            if (m) {
                return '<div class="sk-video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0" title="পণ্যের ভিডিও" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
            }
            // 📘 Facebook (watch, /videos/, fb.watch) — পাবলিক ভিডিও হতে হবে
            if (/(?:facebook\.com|fb\.watch)/i.test(url)) {
                return '<div class="sk-video-wrap sk-video-fb"><iframe src="https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(safe) + '&show_text=false" title="পণ্যের ভিডিও" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen scrolling="no" frameborder="0"></iframe></div>';
            }
            // 🎞️ Vimeo
            m = url.match(/vimeo\.com\/(\d+)/i);
            if (m) {
                return '<div class="sk-video-wrap"><iframe src="https://player.vimeo.com/video/' + m[1] + '" title="পণ্যের ভিডিও" loading="lazy" allowfullscreen></iframe></div>';
            }
            // ☁️ Direct file (mp4/webm/mov — অ্যাডমিন Cloudinary আপলোড সহ)
            return '<div class="sk-video-wrap"><video controls playsinline preload="metadata" src="' + safe + '"></video></div>';
        }

        let selectedColor = null;

            let stockBar = '';

                const pct = Math.min(92, Math.max(15, 100 - Math.round(stock * 1.8)));
                stockBar = `<div class="sk-stock-bar">
                    <div class="sk-stock-bar-top"><span>🔥 ইতিমধ্যে <b>${pct}%</b> বিক্রি হয়েছে</span><span>আর মাত্র ${stock}টি বাকি!</span></div>
                    <div class="sk-stock-bar-track"><div class="sk-stock-bar-fill" style="width:${pct}%"></div></div>
                </div>`;
            }

            // Variant UI
            let variantHtml = '';

                    <div class="sk-variant-opts" id="sizeOpts">${p.sizes.map(s => `<button type="button" class="sk-variant-opt" data-g="size" data-v="${skEscape(s)}" onclick="selectVariantBtn(this)">${skEscape(s)}</button>`).join('')}</div></div>`;

<div class="product-thumbnails" id="productThumbs" style="display:flex !important;gap:10px;margin-top:15px;flex-wrap:wrap;width:100%;clear:both;position:relative;z-index:10;">
    ${['image','image2','image3','image4','image5']
        .filter(key => p[key])
        .map((key, i) => `

                 loading="lazy" decoding="async"
                 onclick="skThumbClick(this)">
        `).join('')}
</div>
                        </div>
                        
                        <!-- Right: Info -->
                        <div class="product-info">
                            <span class="category-tag">${p.category || 'সাধারণ'}</span>
                            <h1>${p.name}</h1>
                            
                            <div class="rating-row">
                                <span class="stars">★★★★★</span>
                                <span class="rating-count">(৫.০ | ১০০+ রিভিউ)</span>
                            </div>
                            
                            <div class="price-row">
                                <span class="current-price">৳${p.price}</span>
                                ${p.oldPrice ? `<span class="old-price">৳${p.oldPrice}</span>` : ''}
                                ${saveAmount > 0 ? `<span class="save-badge">সাশ্রয় ৳${saveAmount}</span>` : ''}

        let relatedTimer = null;

        let relatedCount = 0;
        let relatedPerView = 4;

        function stopRelatedSlider() {
            if (relatedTimer) { clearInterval(relatedTimer); relatedTimer = null; }
        }

        function showRelatedIndex(i) {
            const grid = document.getElementById('relatedGrid');
            if (!grid) return;
            relatedIndex = i;
            const card = grid.querySelector('.related-card');
            if (!card) return;
            const step = card.offsetWidth + 20; // card + gap
            grid.style.transform = 'translateX(-' + (relatedIndex * step) + 'px)';
            document.querySelectorAll('.related-dot').forEach((d, di) => {
                d.classList.toggle('active', di === relatedIndex);
            });
        }

        function goRelated(i) { showRelatedIndex(i); }

        function startRelatedSlider() {
            stopRelatedSlider();
            const grid = document.getElementById('relatedGrid');
            const dotsWrap = document.getElementById('relatedDots');
            if (!grid || !dotsWrap) return;
            const cards = grid.querySelectorAll('.related-card');
            relatedCount = cards.length;
            grid.style.transform = 'translateX(0)';
            relatedIndex = 0;
            if (relatedCount <= 1) return;
            if (relatedCount <= relatedPerView) {
                // সব এক স্ক্রিনে দেখা যায় — slide দরকার নেই, dots-ও নেই
                dotsWrap.innerHTML = '';
                return;
            }
            // dots বানাই
            const dotCount = relatedCount - relatedPerView + 1;
            let dotsHtml = '';
            for (let i = 0; i < dotCount; i++) {
                dotsHtml += '<button class="related-dot' + (i === 0 ? ' active' : '') + '" onclick="goRelated(' + i + ')" aria-label="স্লাইড ' + (i + 1) + '"></button>';
            }
            dotsWrap.innerHTML = dotsHtml;
            // ২ সেকেন্ড পর পর এক কার্ড করে স্লাইড — শেষে আবার শুরু
            relatedTimer = setInterval(() => {
                const max = relatedCount - relatedPerView;
                showRelatedIndex(relatedIndex >= max ? 0 : relatedIndex + 1);
            }, 2000);
        }

            relatedPerView = window.innerWidth < 768 ? 2 : 4;

        let flashInterval = null;
        function startFlashTimer(p) {
            if (!skHasFlash(p)) return;
            clearInterval(flashInterval);
            const tick = () => {
                const remain = Number(p.flashEnd) - Date.now();
                if (remain <= 0) {
                    clearInterval(flashInterval);
                    const box = document.querySelector('.sk-flash-box');
                    if (box) { box.innerHTML = '<span class="sk-flash-title">⏰ ফ্ল্যাশ সেল শেষ!</span>'; box.style.opacity = '.6'; }
                    return;
                }
                const h = Math.floor(remain / 3600000);
                const m = Math.floor((remain % 3600000) / 60000);
                const s = Math.floor((remain % 60000) / 1000);
                const eH = document.getElementById('ftH'), eM = document.getElementById('ftM'), eS = document.getElementById('ftS');
                if (eH) eH.textContent = String(h).padStart(2, '0');
                if (eM) eM.textContent = String(m).padStart(2, '0');
                if (eS) eS.textContent = String(s).padStart(2, '0');
            };
            tick();
            flashInterval = setInterval(tick, 1000);
        }

        function addToCart() {

            const p = currentProduct;

            if (existing) {

                    quantity: quantity

// ===== REVIEW PHOTOS (Firebase Storage) =====
let pendingPhotos = []; // {file, url}

function onReviewPhotos(input) {
    const files = Array.from(input.files || []);
    files.forEach(f => {
        if (!f.type.startsWith('image/')) return;
        if (f.size > 2 * 1024 * 1024) { showToast('❌ ছবি ২MB এর বড় হতে পারবে না: ' + f.name); return; }
        if (pendingPhotos.length >= 2) { showToast('⚠️ সর্বোচ্চ ২টি ছবি'); return; }
        pendingPhotos.push({ file: f, url: URL.createObjectURL(f) });
    });
    input.value = '';
    renderPhotoPreview();
}

function renderPhotoPreview() {
    const box = document.getElementById('reviewPhotoPreview');
    box.innerHTML = pendingPhotos.map((p, i) =>
        `<div class="ph"><img src="${p.url}" alt=""><button type="button" class="rm" onclick="removePendingPhoto(${i})">✕</button></div>`
    ).join('');
}

function removePendingPhoto(i) {
    try { URL.revokeObjectURL(pendingPhotos[i].url); } catch (e) {}
    pendingPhotos.splice(i, 1);
    renderPhotoPreview();
}

async function uploadReviewPhotos() {
    const urls = [];
    for (let i = 0; i < pendingPhotos.length; i++) {
        const f = pendingPhotos[i].file;
        const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        const path = 'review_photos/' + productId + '_' + Date.now() + '_' + i + '.' + ext;
        const snap = await firebase.storage().ref(path).put(f, { contentType: f.type });
        urls.push(await snap.ref.getDownloadURL());
    }
    return urls;
}

async function submitReview(event) {
    event.preventDefault();

    if (selectedRating === 0) {
        showToast('❌ রেটিং দিতে হবে!');
        return;
    }

    const btn = document.getElementById('submitReviewBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> পোস্ট হচ্ছে...';

    const review = {
        productId: productId,
        productName: currentProduct.name,
        rating: selectedRating,
        name: document.getElementById('reviewerName').value.trim(),
        phone: document.getElementById('reviewerPhone').value.trim(),
        comment: document.getElementById('reviewComment').value.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
        // ছবি থাকলে আগে আপলোড
        if (pendingPhotos.length) {
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ছবি আপলোড হচ্ছে...';
            try {
                review.images = await uploadReviewPhotos();
            } catch (upErr) {
                console.error('photo upload failed:', upErr);
                showToast('⚠️ ছবি আপলোড ব্যর্থ — টেক্সট রিভিউই যাচ্ছে');
            }
        }

        await db.collection('reviews').add(review);
        showToast('✅ রিভিউ সফলভাবে পোস্ট হয়েছে!');
        event.target.reset();
        pendingPhotos.forEach(p => { try { URL.revokeObjectURL(p.url); } catch (e) {} });
        pendingPhotos = [];
        renderPhotoPreview();
        selectedRating = 0;
        updateStars(0);
        hideReviewForm();
        loadReviews();
    } catch (error) {
        showToast('❌ ' + error.message);
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> রিভিউ পোস্ট করুন';
}

        let zoomScale = 1; let zoomTranslateX = 0; let zoomTranslateY = 0; let lastTouchDist = 0; let isDragging = false; let lastX = 0, lastY = 0;
        function openImageZoom(imgSrc) {

                imgSrc = document.getElementById('mainImage')?.src || '';

            initZoomEvents();

        function closeImageZoom(e) { if (e && e.target !== document.getElementById('imageZoomModal') && e.target !== document.getElementById('zoomContainer')) return; closeImageZoomDirect(); }
        function closeImageZoomDirect() { document.getElementById('imageZoomModal').classList.remove('active'); document.body.style.overflow = ''; resetZoom(); }
        function updateZoomTransform() { document.getElementById('zoomImage').style.transform = `translate(${zoomTranslateX}px, ${zoomTranslateY}px) scale(${zoomScale})`; }
        function zoomIn() { zoomScale = Math.min(zoomScale + 0.5, 5); updateZoomTransform(); }
        function zoomOut() { zoomScale = Math.max(zoomScale - 0.5, 1); if (zoomScale === 1) { zoomTranslateX = 0; zoomTranslateY = 0; } updateZoomTransform(); }
        function resetZoom() { zoomScale = 1; zoomTranslateX = 0; zoomTranslateY = 0; updateZoomTransform(); }
        function changeMainImage(src) { document.getElementById('mainImage').src = src; skManualPause(); }

        // ===== 🔄 AUTO IMAGE SLIDESHOW — ভ্যারিয়েন্ট ছবি নিজে নিজে ঘুরবে =====
        let skSlideTimer = null;
        let skSlideIdx = 0;
        let skSlideResumeAt = 0;   // ম্যানুয়াল ক্লিকের পর কখন আবার চালু হবে
        let skSlideHover = false;  // ডেস্কটপে মাউস ছবির উপর থাকলে পজ
        const SK_SLIDE_MS = 3000;        // প্রতি ৩ সেকেন্ডে পরের ছবি
        const SK_MANUAL_PAUSE_MS = 10000; // নিজে ক্লিক/টাচ করলে ১০ সেকেন্ড বিরতি

        function skGetThumbs() {
            return Array.from(document.querySelectorAll('#productThumbs .sk-thumb'));
        }

        function skManualPause() {
            skSlideResumeAt = Date.now() + SK_MANUAL_PAUSE_MS;
        }

        function skShowSlide(idx) {
            const thumbs = skGetThumbs();
            const main = document.getElementById('mainImage');
            if (!main || thumbs.length === 0) return;
            idx = ((idx % thumbs.length) + thumbs.length) % thumbs.length;
            const url = thumbs[idx].dataset.full || thumbs[idx].src;
            if (main.src !== url) {
                main.classList.add('sk-img-fading');
                setTimeout(() => {
                    main.src = url;
                    const done = () => main.classList.remove('sk-img-fading');
                    if (main.complete && main.naturalWidth > 0) { setTimeout(done, 120); }
                    else { main.onload = done; setTimeout(done, 700); }
                }, 200);
            }
            skSlideIdx = idx;
            thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
        }

        function skThumbClick(el) {
            const idx = skGetThumbs().indexOf(el);
            if (idx === -1) return;
            skShowSlide(idx);
            skManualPause(); // নিজে দেখার পর কিছুক্ষণ অটো বন্ধ
        }

        function skSlideTick() {
            if (document.hidden) return;                 // অন্য ট্যাবে গেলে বন্ধ
            if (skSlideHover) return;                    // মাউস ছবির উপর → পজ
            if (Date.now() < skSlideResumeAt) return;    // ম্যানুয়াল ক্লিকের বিরতি
            const zoom = document.getElementById('imageZoomModal');
            if (zoom && zoom.classList.contains('active')) return; // জুম খোলা → পজ
            if (skGetThumbs().length < 2) return;
            skShowSlide(skSlideIdx + 1);
        }

        function startImageAutoRotate() {
            if (skSlideTimer) { clearInterval(skSlideTimer); skSlideTimer = null; }
            const thumbs = skGetThumbs();
            if (thumbs.length < 2) return; // ১টা ছবি থাকলে স্লাইড দরকার নেই

            // বর্তমানে যে ছবিটা দেখাচ্ছে সেটাই শুরুর পয়েন্ট
            const main = document.getElementById('mainImage');
            const cur = main ? main.src : '';
            const match = thumbs.findIndex(t => (t.dataset.full || t.src) === cur);
            skSlideIdx = match >= 0 ? match : 0;
            thumbs.forEach((t, i) => t.classList.toggle('active', i === skSlideIdx));

            skSlideTimer = setInterval(skSlideTick, SK_SLIDE_MS);

            // হোভার/টাচ হলে পজ — একবারই বাইন্ড হবে
            const wrap = document.querySelector('.product-image-wrapper');
            if (wrap && !wrap.dataset.skSlideBound) {
                wrap.dataset.skSlideBound = '1';
                wrap.addEventListener('mouseenter', () => { skSlideHover = true; });
                wrap.addEventListener('mouseleave', () => { skSlideHover = false; });
                wrap.addEventListener('touchstart', () => {
                    skSlideResumeAt = Date.now() + 8000; // মোবাইলে টাচ করলে ৮ সেকেন্ড বিরতি
                }, { passive: true });
            }
        }
        function initZoomEvents() {
            const container = document.getElementById('zoomContainer'); const img = document.getElementById('zoomImage');
            img.ondblclick = () => { if (zoomScale > 1) resetZoom(); else { zoomScale = 2.5; updateZoomTransform(); } };
            container.onwheel = (e) => { e.preventDefault(); zoomScale = Math.min(Math.max(1, zoomScale + (e.deltaY > 0 ? -0.2 : 0.2)), 5); if (zoomScale === 1) { zoomTranslateX = 0; zoomTranslateY = 0; } updateZoomTransform(); };
            container.onmousedown = (e) => { if (zoomScale <= 1) return; isDragging = true; lastX = e.clientX; lastY = e.clientY; };
            window.onmouseup = () => { isDragging = false; };
            container.onmousemove = (e) => { if (!isDragging || zoomScale <= 1) return; zoomTranslateX += e.clientX - lastX; zoomTranslateY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; updateZoomTransform(); };
            container.ontouchstart = (e) => { if (e.touches.length === 1) { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; } else if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } };
            container.ontouchmove = (e) => { e.preventDefault(); if (e.touches.length === 1 && isDragging && zoomScale > 1) { zoomTranslateX += e.touches[0].clientX - lastX; zoomTranslateY += e.touches[0].clientY - lastY; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; updateZoomTransform(); } else if (e.touches.length === 2) { const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (lastTouchDist > 0) { zoomScale = Math.min(Math.max(1, zoomScale * (dist / lastTouchDist)), 5); updateZoomTransform(); } lastTouchDist = dist; } };
            container.ontouchend = () => { isDragging = false; lastTouchDist = 0; };
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeImageZoomDirect(); });
        
        // ===== COPY LINK =====
        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('✅ লিংক কপি হয়েছে!');
            });
        }

        // ===== CART COUNT =====
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // ===== TOAST =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        init();
    </script>
