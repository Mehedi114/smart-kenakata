<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>পেজ পাওয়া যায়নি - স্মার্ট কেনাকাটা</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(1000px 500px at 80% -100px, rgba(37,99,235,.08), transparent 60%), #f8fafc;
            padding: 20px;
        }
        .box { text-align: center; max-width: 440px; }
        .emoji { font-size: 84px; margin-bottom: 8px; }
        h1 { font-size: 84px; font-weight: 800; color: #2563eb; line-height: 1; }
        h2 { font-size: 22px; color: #0f172a; margin: 10px 0 6px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 24px; }
        .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 26px; border-radius: 999px; text-decoration: none;
            font-weight: 700; font-size: 15px; transition: transform .2s;
        }
        a:active { transform: scale(.95); }
        .primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; box-shadow: 0 8px 22px rgba(37,99,235,.35); }
        .secondary { background: #fff; color: #1d4ed8; border: 2px solid #bfdbfe; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">🛒💨</div>
        <h1>৪০৪</h1>
        <h2>উফ! পেজটা খুঁজে পাওয়া যাচ্ছে না</h2>
        <p>হয়তো লিংকটা ভুল, অথবা পেজটা সরিয়ে ফেলা হয়েছে। চিন্তা নেই — সেরা অফারগুলো এখনো আছে!</p>
        <div class="btns">
            <a href="/smart-kenakata/" class="primary">🏠 হোমে ফিরুন</a>
            <a href="/smart-kenakata/category.html?cat=all" class="secondary">🛍️ সব পণ্য দেখুন</a>
        </div>
    </div>
</body>
</html>
